[package]
name = "railgun_module"
version = "0.1.0"
edition = "2021"
description = "Logos RAILGUN module — private transactions (shield / private transfer / unshield) for the EVM wallet, wrapping the native railgun-rs engine."

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# RAILGUN engine (railgun-rs) + its EIP-1193 provider trait, consumed as git deps.
railgun = { git = "https://github.com/ethereum/kohaku" }
eip-1193-provider = { git = "https://github.com/ethereum/kohaku" }
# ERC-4337 relayer path (the private-send broadcaster): SimpleSmartAccount (7702)
# + PimlicoBundler, used by `prepare_relayed_send`.
userop-kit = { git = "https://github.com/ethereum/kohaku" }

# `signers` re-exports the `Signer` trait we implement for the keystore bridge.
alloy = { version = "1.8", default-features = false, features = ["signers"] }
# `reqwest::Url` is the bundler-URL type PimlicoBundler::new takes; the `url`
# crate is its re-export — one version in the tree unifies the types.
url = "2"
# THE SAME wasmer ark-circom's witness generator runs the circuit under — not a
# second copy. `default-features = false, features = ["default"]` (= `sys-default`
# → cranelift) is verbatim what ark-circom asks for, so cargo unifies the two into
# one crate with one feature set and `witness_engine` measures the SAME backend
# the engine proves with (#188). If this drifted from ark-circom's request the
# probe would measure a backend the engine does not use.
wasmer = { version = "6.1", default-features = false, features = ["default"] }
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.9.2"
# The engine is async; the glue drives it on a per-call current-thread runtime so
# the engine's outbound `modules().eth_rpc_module` IPC runs on the dispatch
# worker thread (which carries the Qt event loop under concurrency:multi).
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros"] }

# Provided by logos-module-builder at build time (staged into ../logos-rust-sdk-src).
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

# ── the interpreter backend, EVERYWHERE THE BINDGEN WORKS ─────────────────────
# `"wasmi"` is ADDITIVE to the line above and changes nothing about the backend
# the engine proves with: `BackendKind::default()` still answers cranelift while
# `sys-default` is in the set. It puts wasmer's pure-Rust interpreter in the
# image so `witness_engine` can measure the way OUT of the JIT on the same
# device, in the same process (#188) — the measurement that found iOS kills the
# process at the JIT's first emitted call.
#
# AND IT IS ASKED FOR ONLY WHERE ITS BINDGEN WORKS (#202). wasmer's build script
# generates the `wasmi` C-API bindings with bindgen, and bindgen is the part of
# this graph that a Logos cross build does not configure. TWO of the three mobile
# targets failed on it, each with its own clang diagnostic, and both since #188
# added the feature:
#
#   aarch64-android          bindgen gets `--target aarch64-linux-android` with the
#                            BUILD platform's nix libcxx headers and no NDK
#                            sysroot, so libcxx's `platform.h` reaches for a
#                            `features.h` that is not on the include path:
#                              ... ClangDiagnostic(... 'features.h' file not found)
#   aarch64-ios-simulator    bindgen's own libclang rejects the triple outright:
#                              ... ClangDiagnostic("error: version 'sim' in target
#                              triple 'arm64-apple-ios-sim' is invalid")
#
# The Android one took every Android Bundled set whose closure touches this
# module's catalog entry down with it — this module is in the mobile catalog, so
# "whose closure touches it" is not only "which names it" — and the simulator one
# did the same there, unnoticed, because no set had yet asked for railgun on a
# simulator.
#
# NOTHING IS LOST ON EITHER. The question the interpreter answers is "the JIT is
# refused here, what works instead", and it is a question about a PHYSICAL iOS
# device: Android executes emitted code freely (measured — see docs/specs.md:
# `witness_engine_probe` on a Samsung SM-G990B reaches `call` under cranelift and
# answers 42), and a simulator's pages are macOS pages where RWX is allowed, so
# it proves nothing a desktop does not. What remains is `aarch64-apple-ios`,
# which is exactly where #188 measured, and every desktop — the probe's positive
# control, which is what makes a handset's answer mean anything.
#
# Cargo UNIONS features across these sections, so this is exactly the old line
# everywhere it is still asked for. Widen the cfg back the day bindgen is given
# the NDK sysroot and a libclang that knows `-sim`.
[target.'cfg(not(any(target_os = "android", target_abi = "sim")))'.dependencies]
wasmer = { version = "6.1", default-features = false, features = ["wasmi"] }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

# The engine pins forks of these via the kohaku workspace; an out-of-tree
# consumer must replicate the patch so the dep graph resolves identically.
[patch.crates-io]
ruint = { git = "https://github.com/Robert-MacWha/ruint" }
ark-circom = { git = "https://github.com/Robert-MacWha/circom-compat", branch = "release/0.6.0" }
