[package]
name = "railgun_module"
version = "0.1.0"
edition = "2021"
description = "Logos RAILGUN module — private transactions (shield / private transfer / unshield) for the EVM wallet, wrapping the native railgun-rs engine."

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# RAILGUN engine (railgun-rs) + its EIP-1193 provider trait, consumed as git deps.
railgun = { git = "https://github.com/ethereum/kohaku" }
eip-1193-provider = { git = "https://github.com/ethereum/kohaku" }
# ERC-4337 relayer path (the private-send broadcaster): SimpleSmartAccount (7702)
# + PimlicoBundler, used by `prepare_relayed_send`.
userop-kit = { git = "https://github.com/ethereum/kohaku" }

# `signers` re-exports the `Signer` trait we implement for the keystore bridge.
alloy = { version = "1.8", default-features = false, features = ["signers"] }
# `reqwest::Url` is the bundler-URL type PimlicoBundler::new takes; the `url`
# crate is its re-export — one version in the tree unifies the types.
url = "2"
# THE SAME wasmer ark-circom's witness generator runs the circuit under — not a
# second copy. `default-features = false, features = ["default"]` (= `sys-default`
# → cranelift) is verbatim what ark-circom asks for, so cargo unifies the two into
# one crate with one feature set and `witness_engine` measures the SAME backend
# the engine proves with (#188). If this drifted from ark-circom's request the
# probe would measure a backend the engine does not use.
# `"wasmi"` is ADDITIVE and changes nothing about that: `BackendKind::default()`
# still answers cranelift while `sys-default` is in the set. It puts the pure-Rust
# interpreter in the image so the probe can measure the way OUT of the JIT on the
# same device, in the same process.
wasmer = { version = "6.1", default-features = false, features = ["default", "wasmi"] }
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.9.2"
# The engine is async; the glue drives it on a per-call current-thread runtime so
# the engine's outbound `modules().eth_rpc_module` IPC runs on the dispatch
# worker thread (which carries the Qt event loop under concurrency:multi).
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros"] }

# Provided by logos-module-builder at build time (staged into ../logos-rust-sdk-src).
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

# The engine pins forks of these via the kohaku workspace; an out-of-tree
# consumer must replicate the patch so the dep graph resolves identically.
[patch.crates-io]
ruint = { git = "https://github.com/Robert-MacWha/ruint" }
ark-circom = { git = "https://github.com/Robert-MacWha/circom-compat", branch = "release/0.6.0" }
